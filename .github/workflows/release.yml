name: Rilascio

# Quando crei un tag v* (es. v1.1.0) costruisce il pacchetto .deb e lo allega alla release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deb:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npx electron-builder --linux deb --publish never
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/*.deb
      - uses: actions/upload-artifact@v4
        with:
          name: quadra-deb
          path: dist/*.deb
